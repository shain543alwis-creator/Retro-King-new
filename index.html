<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PEO Retro King Selection</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for Browser JSX Compiling -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase 11 SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://peo-retro-king-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;
    window.firebaseDb = db;
  </script>

  <style>
    body {
      margin: 0;
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">

  <div id="root" class="w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Crown = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.3 8.87a.5.5 0 0 0 .416.257l6.23.518a.5.5 0 0 1 .288.882l-4.7 4.14a.5.5 0 0 0-.153.473l1.39 6.07a.5.5 0 0 1-.75.545L12.3 18.5a.5.5 0 0 0-.5 0l-5.419 3.265a.5.5 0 0 1-.75-.545l1.39-6.07a.5.5 0 0 0-.153-.473l-4.7-4.14a.5.5 0 0 1 .288-.882l6.23-.518a.5.5 0 0 0 .416-.257z"/><path d="m2 4 3 12"/><path d="m22 4-3 12"/></svg>
    );
    const Trophy = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
    );
    const Award = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
    );
    const Plus = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    );
    const Trash2 = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
    );
    const UserCheck = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
    );
    const Eye = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    );
    const EyeOff = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
    );
    const Sparkles = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
    );
    const Users = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );
    const Play = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    );
    const Volume2 = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    );
    const VolumeX = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
    );
    const X = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const Camera = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    );
    const RotateCcw = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const Upload = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
    );
    const User = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const ShieldCheck = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    );
    const LogOut = ({ className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    );

    const CRITERIA_LIST = [
      { id: 'costume', name: 'Retro Styling & Costume', max: 25, desc: 'Authenticity, retro flair & hair/attire details' },
      { id: 'presence', name: 'Attitude & Stage Presence', max: 25, desc: 'Confidence, walk, posture & retro swagger' },
      { id: 'theme', name: 'Theme Authenticity', max: 25, desc: 'Adherence to classic era vibe & character representation' },
      { id: 'charm', name: 'Audience Impact & Charm', max: 25, desc: 'Crowd connection, energy, X-factor & overall appeal' }
    ];

    const DEFAULT_JUDGES = ['Judge 1', 'Judge 2', 'Judge 3'];

    function App() {
      const [userRole, setUserRole] = useState(() => localStorage.getItem('peo_user_role') || null);
      const [activeTab, setActiveTab] = useState('judging');
      const [contestants, setContestants] = useState([]);
      const [judges, setJudges] = useState(DEFAULT_JUDGES);
      const [scores, setScores] = useState({});
      const [isCloudConnected, setIsCloudConnected] = useState(false);
      
      const [customLogo, setCustomLogo] = useState(() => localStorage.getItem('peo_custom_logo') || 'peotv logo.png');
      const [newContestantName, setNewContestantName] = useState('');
      const [newJudgeName, setNewJudgeName] = useState('');
      const [capturedPhoto, setCapturedPhoto] = useState(null);
      const [isCameraActive, setIsCameraActive] = useState(false);
      const videoRef = useRef(null);
      const mediaStreamRef = useRef(null);

      const [selectedJudge, setSelectedJudge] = useState('Judge 1');
      const [selectedContestantId, setSelectedContestantId] = useState(1);
      const [showScoresInLeaderboard, setShowScoresInLeaderboard] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      /* Reveal Modal State */
      const [revealModal, setRevealModal] = useState({
        isOpen: false,
        title: '',
        contestant: null,
        rank: null,
        countdown: 10,
        isCounting: false
      });

      const canvasRef = useRef(null);
      const audioCtxRef = useRef(null);

      const handleSelectRole = (role) => {
        setUserRole(role);
        localStorage.setItem('peo_user_role', role);
        if (role && role !== 'Admin') {
          setSelectedJudge(role);
          setActiveTab('judging');
        } else if (role === 'Admin') {
          setActiveTab('admin');
        }
      };

      const handleLogout = () => {
        setUserRole(null);
        localStorage.removeItem('peo_user_role');
        stopCamera();
      };

      useEffect(() => {
        if (userRole && userRole !== 'Admin') {
          setSelectedJudge(userRole);
          setActiveTab('judging');
        }
      }, [userRole]);

      useEffect(() => {
        let unsubscribeContestants;
        let unsubscribeJudges;
        let unsubscribeScores;
        let unsubscribeLogo;

        const initFirebaseListeners = () => {
          if (!window.firebaseDb) {
            setTimeout(initFirebaseListeners, 100);
            return;
          }

          const contestantsRef = window.dbRef(window.firebaseDb, 'contestants');
          unsubscribeContestants = window.dbOnValue(contestantsRef, (snapshot) => {
            const data = snapshot.val();
            setContestants(data ? Object.values(data) : []);
            setIsCloudConnected(true);
          });

          const judgesRef = window.dbRef(window.firebaseDb, 'judges');
          unsubscribeJudges = window.dbOnValue(judgesRef, (snapshot) => {
            const data = snapshot.val();
            if (data && Array.isArray(data) && data.length > 0) {
              setJudges(data);
            }
          });

          const scoresRef = window.dbRef(window.firebaseDb, 'scores');
          unsubscribeScores = window.dbOnValue(scoresRef, (snapshot) => {
            setScores(snapshot.val() || {});
          });

          const logoRef = window.dbRef(window.firebaseDb, 'settings/logo');
          unsubscribeLogo = window.dbOnValue(logoRef, (snapshot) => {
            const val = snapshot.val();
            if (val) {
              setCustomLogo(val);
              localStorage.setItem('peo_custom_logo', val);
            }
          });
        };

        initFirebaseListeners();

        return () => {
          if (unsubscribeContestants) unsubscribeContestants();
          if (unsubscribeJudges) unsubscribeJudges();
          if (unsubscribeScores) unsubscribeScores();
          if (unsubscribeLogo) unsubscribeLogo();
        };
      }, []);

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64Logo = reader.result;
            setCustomLogo(base64Logo);
            localStorage.setItem('peo_custom_logo', base64Logo);
            if (window.firebaseDb) {
              window.dbSet(window.dbRef(window.firebaseDb, 'settings/logo'), base64Logo);
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddJudge = (e) => {
        e.preventDefault();
        const trimmed = newJudgeName.trim();
        if (!trimmed || judges.includes(trimmed)) return;

        const updatedJudges = [...judges, trimmed];
        if (window.firebaseDb) {
          window.dbSet(window.dbRef(window.firebaseDb, 'judges'), updatedJudges);
        } else {
          setJudges(updatedJudges);
        }
        setNewJudgeName('');
      };

      const handleDeleteJudge = (judgeToDelete) => {
        if (judges.length <= 1) {
          alert("At least one judge must remain in the panel.");
          return;
        }
        const updatedJudges = judges.filter(j => j !== judgeToDelete);
        if (window.firebaseDb) {
          window.dbSet(window.dbRef(window.firebaseDb, 'judges'), updatedJudges);
        } else {
          setJudges(updatedJudges);
        }
        if (selectedJudge === judgeToDelete) {
          setSelectedJudge(updatedJudges[0]);
        }
      };

      const handleAddContestant = (e) => {
        e.preventDefault();
        if (!newContestantName.trim()) return;
        
        const nextNumber = contestants.length > 0 ? Math.max(...contestants.map(c => c.id)) + 1 : 1;
        const newContestant = { 
          id: nextNumber, 
          name: newContestantName.trim(),
          photo: capturedPhoto 
        };

        if (window.firebaseDb) {
          window.dbSet(window.dbRef(window.firebaseDb, 'contestants/' + nextNumber), newContestant);
        } else {
          setContestants([...contestants, newContestant]);
        }

        setNewContestantName('');
        setCapturedPhoto(null);
        stopCamera();
      };

      const handleDeleteContestant = (id) => {
        if (window.firebaseDb) {
          window.dbSet(window.dbRef(window.firebaseDb, 'contestants/' + id), null);
          window.dbSet(window.dbRef(window.firebaseDb, 'scores/' + id), null);
        } else {
          setContestants(contestants.filter(c => c.id !== id));
        }

        if (selectedContestantId === id) {
          const remaining = contestants.filter(c => c.id !== id);
          if (remaining.length > 0) setSelectedContestantId(remaining[0].id);
        }
      };

      const handleScoreChange = (contestantId, judge, criteriaId, val) => {
        const numericVal = Math.min(25, Math.max(0, Number(val) || 0));
        
        if (window.firebaseDb) {
          window.dbSet(
            window.dbRef(window.firebaseDb, `scores/${contestantId}/${judge}/${criteriaId}`),
            numericVal
          );
        } else {
          setScores(prev => ({
            ...prev,
            [contestantId]: {
              ...prev[contestantId],
              [judge]: {
                ...prev[contestantId]?.[judge],
                [criteriaId]: numericVal
              }
            }
          }));
        }
      };

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } } 
          });
          mediaStreamRef.current = stream;
          setIsCameraActive(true);
        } catch (err) {
          try {
            const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
            mediaStreamRef.current = fallbackStream;
            setIsCameraActive(true);
          } catch (fallbackErr) {
            alert("Unable to access camera device. Please check site permissions.");
            setIsCameraActive(false);
          }
        }
      };

      useEffect(() => {
        if (isCameraActive && videoRef.current && mediaStreamRef.current) {
          videoRef.current.srcObject = mediaStreamRef.current;
          videoRef.current.play().catch(e => console.warn("Video play interrupted:", e));
        }
      }, [isCameraActive]);

      const stopCamera = () => {
        if (mediaStreamRef.current) {
          mediaStreamRef.current.getTracks().forEach(track => track.stop());
          mediaStreamRef.current = null;
        }
        setIsCameraActive(false);
      };

      const takeSnapshot = () => {
        if (!videoRef.current) return;
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');
        
        const video = videoRef.current;
        const minDim = Math.min(video.videoWidth, video.videoHeight);
        const startX = (video.videoWidth - minDim) / 2;
        const startY = (video.videoHeight - minDim) / 2;
        
        ctx.drawImage(video, startX, startY, minDim, minDim, 0, 0, 320, 320);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        setCapturedPhoto(dataUrl);
        stopCamera();
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setCapturedPhoto(reader.result);
          reader.readAsDataURL(file);
        }
      };

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const getAudioContext = () => {
        if (!audioCtxRef.current) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new AudioCtx();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      };

      const playHeartbeatSound = (step) => {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const urgencyMult = 1 + (10 - step) * 0.08;

          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          const filter1 = ctx.createBiquadFilter();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(80, now);
          osc1.frequency.exponentialRampToValueAtTime(40, now + 0.12);

          filter1.type = 'lowpass';
          filter1.frequency.setValueAtTime(130, now);

          gain1.gain.setValueAtTime(0, now);
          gain1.gain.linearRampToValueAtTime(1.0 * urgencyMult, now + 0.02);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          osc1.connect(filter1);
          filter1.connect(gain1);
          gain1.connect(ctx.destination);

          osc1.start(now);
          osc1.stop(now + 0.15);

          const dubTime = now + 0.14;
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          const filter2 = ctx.createBiquadFilter();

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(100, dubTime);
          osc2.frequency.exponentialRampToValueAtTime(45, dubTime + 0.14);

          filter2.type = 'lowpass';
          filter2.frequency.setValueAtTime(150, dubTime);

          gain2.gain.setValueAtTime(0, dubTime);
          gain2.gain.linearRampToValueAtTime(1.2 * urgencyMult, dubTime + 0.02);
          gain2.gain.exponentialRampToValueAtTime(0.001, dubTime + 0.16);

          osc2.connect(filter2);
          filter2.connect(gain2);
          gain2.connect(ctx.destination);

          osc2.start(dubTime);
          osc2.stop(dubTime + 0.18);
        } catch (e) {
          console.warn("Audio issue:", e);
        }
      };

      const playFireworkBurstSound = () => {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          const launchOsc = ctx.createOscillator();
          const launchGain = ctx.createGain();
          launchOsc.type = 'sine';
          launchOsc.frequency.setValueAtTime(120, now);
          launchOsc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
          
          launchGain.gain.setValueAtTime(0.5, now);
          launchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          
          launchOsc.connect(launchGain);
          launchGain.connect(ctx.destination);
          launchOsc.start(now);
          launchOsc.stop(now + 0.3);

          const burstDelay = now + 0.28;
          const bufferSize = ctx.sampleRate * 0.6;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.15));
          }

          const noiseSource = ctx.createBufferSource();
          noiseSource.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(400, burstDelay);
          filter.frequency.linearRampToValueAtTime(1200, burstDelay + 0.1);
          filter.frequency.exponentialRampToValueAtTime(200, burstDelay + 0.5);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.7, burstDelay);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, burstDelay + 0.6);

          noiseSource.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          noiseSource.start(burstDelay);
          noiseSource.stop(burstDelay + 0.65);
        } catch (e) {
          console.warn("Firework audio error:", e);
        }
      };

      const playTrumpetFanfare = (rank) => {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          const chords = rank === 1 ? [
            { freqs: [261.63, 329.63, 392.00, 523.25], duration: 0.3 },
            { freqs: [293.66, 369.99, 440.00, 587.33], duration: 0.3 },
            { freqs: [329.63, 415.30, 493.88, 659.25], duration: 0.3 },
            { freqs: [523.25, 659.25, 783.99, 1046.50], duration: 1.2 }
          ] : [
            { freqs: [220.00, 277.18, 329.63, 440.00], duration: 0.4 },
            { freqs: [261.63, 329.63, 392.00, 523.25], duration: 0.4 },
            { freqs: [329.63, 415.30, 493.88, 659.25], duration: 0.9 }
          ];

          let currentTimeOffset = 0;

          chords.forEach((chordData) => {
            const chordStartTime = now + currentTimeOffset;
            chordData.freqs.forEach((freq) => {
              [-4, 4].forEach((detuneVal) => {
                const osc = ctx.createOscillator();
                const filter = ctx.createBiquadFilter();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, chordStartTime);
                osc.detune.setValueAtTime(detuneVal, chordStartTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(freq * 1.8, chordStartTime);
                filter.frequency.exponentialRampToValueAtTime(freq * 3.5, chordStartTime + 0.1);
                filter.frequency.exponentialRampToValueAtTime(freq * 2, chordStartTime + chordData.duration);

                gain.gain.setValueAtTime(0, chordStartTime);
                gain.gain.linearRampToValueAtTime(0.18, chordStartTime + 0.05);
                gain.gain.setValueAtTime(0.15, chordStartTime + chordData.duration - 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, chordStartTime + chordData.duration);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                osc.start(chordStartTime);
                osc.stop(chordStartTime + chordData.duration);
              });
            });
            currentTimeOffset += chordData.duration * 0.9;
          });
        } catch (e) {
          console.warn("Fanfare error:", e);
        }
      };

      const getCriteriaScore = (contestantId, judge, criteriaId) => {

      const getContestantStats = (contestantId) => {
        const contestantScores = scores[contestantId] || {};
        const judgesWhoScored = Object.keys(contestantScores);
        
        if (judgesWhoScored.length === 0) return { totalScore: 0, avgScore: 0, judgeCount: 0 };
        
        let sumTotals = 0;
        judgesWhoScored.forEach(j => {
          const jTotal = Object.values(contestantScores[j] || {}).reduce((a, b) => a + Number(b), 0);
          sumTotals += jTotal;
        });

        const avg = sumTotals / (judgesWhoScored.length || 1);
        return {
          totalScore: sumTotals,
          avgScore: Math.round(avg * 10) / 10,
          judgeCount: judgesWhoScored.length

      };

              setRevealModal(prev => ({ ...prev, countdown: prev.countdown - 1 }));
            }, 1000);
          } else {

            playTrumpetFanfare(revealModal.rank);

        }
        return () => clearTimeout(timer);
      }, [revealModal.isOpen, revealModal.isCounting, revealModal.countdown]);

      useEffect(() => {
        if (!revealModal.isOpen || revealModal.isCounting || !canvasRef.current) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let animationFrameId;
        let particles = [];
        let rockets = [];

        const rank = revealModal.rank;
        const particleCount = rank === 1 ? 240 : rank === 2 ? 140 : 80;
        const fireworkSpawnRate = rank === 1 ? 0.08 : rank === 2 ? 0.04 : 0.015;

        const colors = rank === 1 
          ? ['#00AEEF', '#22B14C', '#004080', '#38BDF8', '#4ADE80', '#FFFFFF']
          : rank === 2 
          ? ['#38BDF8', '#818CF8', '#94A3B8', '#FFFFFF']
          : ['#004080', '#22B14C', '#00AEEF', '#FFFFFF'];

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * (rank === 1 ? 18 : 12),
            vy: (Math.random() - 0.6) * (rank === 1 ? 18 : 12),
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rSpeed: (Math.random() - 0.5) * 10,
            opacity: 1,
            decay: Math.random() * 0.008 + 0.004
          });
        }

        const createFireworkRocket = () => {
          rockets.push({
            x: Math.random() * (canvas.width * 0.8) + canvas.width * 0.1,
            y: canvas.height,
            targetY: Math.random() * (canvas.height * 0.5) + canvas.height * 0.1,
            vy: - (Math.random() * 6 + 10),
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        };

        const explodeRocket = (x, y, color) => {
          playFireworkBurstSound();
          const count = rank === 1 ? 50 : 30;
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 / count) * i;
            const speed = Math.random() * 6 + 2;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: Math.random() * 4 + 2,
              color: color,
              rotation: 0,
              rSpeed: 0,
              opacity: 1,
              decay: Math.random() * 0.015 + 0.01
            });
          }
        };

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (Math.random() < fireworkSpawnRate) {
            createFireworkRocket();
          }

          for (let i = rockets.length - 1; i >= 0; i--) {
            const r = rockets[i];
            r.y += r.vy;
            ctx.beginPath();
            ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = r.color;
            ctx.fill();

            if (r.y <= r.targetY) {
              explodeRocket(r.x, r.y, r.color);
              rockets.splice(i, 1);
            }
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.12;
            p.rotation += p.rSpeed;
            p.opacity -= p.decay;

            if (p.opacity <= 0) {
              particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = p.opacity;
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => cancelAnimationFrame(animationFrameId);
      }, [revealModal.isOpen, revealModal.isCounting]);

                      )}
                      <div className="font-bold text-white text-xs line-clamp-1">{c.name}</div>
                      <div className="text-[10px] font-mono text-slate-400 mt-1">Ready for Reveal</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </main>
      </div>

      {revealModal.isOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-xl p-4">
          <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-10" />

          <button
            onClick={() => setRevealModal({ ...revealModal, isOpen: false })}
            className="absolute top-6 right-6 z-30 p-3 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white rounded-full transition-all"
          >
            <X className="w-6 h-6" />
          </button>

          <div className="relative z-20 w-full max-w-xl bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-cyan-400/50 rounded-3xl p-8 text-center shadow-2xl">
            {revealModal.isCounting ? (
              <div className="py-10 space-y-5">
                <div className="text-xs font-extrabold uppercase tracking-widest text-cyan-400 animate-pulse">
                  Revealing {revealModal.title}...
                </div>
                
                <div className="relative w-36 h-36 mx-auto flex items-center justify-center">
                  <div className="absolute inset-0 bg-cyan-500/20 rounded-full blur-xl animate-ping"></div>
                  <div className="w-32 h-32 border-4 border-cyan-500/40 border-t-cyan-400 rounded-full animate-spin"></div>
                  <span className="absolute font-mono text-6xl font-black text-cyan-300 animate-bounce">
                    {revealModal.countdown}
                  </span>
                </div>
                <p className="text-xs text-slate-400 font-mono">Suspense building...</p>
              </div>
            ) : (
              <div className="space-y-5 animate-in fade-in zoom-in duration-700 transition-transform">
                <div className="inline-flex items-center gap-2 px-5 py-1.5 rounded-full bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 text-xs font-bold uppercase tracking-widest">
                  <Sparkles className="w-4 h-4 text-cyan-400" />
                  {revealModal.title}
                </div>

                <div className="space-y-1">
                  <h4 className="text-xs uppercase tracking-widest text-slate-400 font-semibold">
                    Congratulations To Contestant #{revealModal.contestant.id}!
                  </h4>
                  <h1 className="text-3xl sm:text-5xl font-black bg-gradient-to-r from-cyan-200 via-blue-100 to-green-400 bg-clip-text text-transparent tracking-wide leading-tight drop-shadow-[0_10px_20px_rgba(0,174,235,0.4)]">
                    {revealModal.contestant.name}
                  </h1>
                </div>

                <div className="relative w-36 h-36 mx-auto my-4 flex items-center justify-center">
                  <div className="absolute inset-0 bg-gradient-to-r from-cyan-400 via-blue-500 to-green-500 rounded-full blur-2xl opacity-90"></div>
                  <div className="relative w-full h-full bg-slate-950 border-4 border-cyan-400 rounded-full flex items-center justify-center shadow-2xl overflow-hidden">
                    {revealModal.contestant.photo ? (
                      <img src={revealModal.contestant.photo} alt={revealModal.contestant.name} className="w-full h-full object-cover" />
                    ) : (
                      <Crown className="w-16 h-16 text-cyan-400 stroke-[2.5]" />
                    )}
                  </div>
                </div>

                <div className="flex justify-center gap-2 text-xs text-cyan-300 font-bold uppercase tracking-widest">
                  <span className="px-3 py-1 bg-cyan-500/20 rounded-lg border border-cyan-500/40">👑 Grand Official Finalist</span>
                </div>

                <button
                  onClick={() => setRevealModal({ ...revealModal, isOpen: false })}
                  className="mt-4 px-6 py-3 bg-gradient-to-r from-cyan-400 via-blue-500 to-green-400 text-slate-950 font-bold rounded-xl shadow-lg hover:scale-105 transition-all text-xs uppercase tracking-wider"
                >
                  Close & Return to Stage
                </button>
              </div>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
